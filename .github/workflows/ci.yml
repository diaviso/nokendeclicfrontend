name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` enchaîne la compilation Turbopack et la vérification
      # des types : inutile de lancer `tsc` séparément.
      - name: Types et build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://nokendeclicbackend-production.up.railway.app

      - name: Audit de sécurité (critique bloquant)
        run: npm audit --audit-level=critical

      # Les icônes sont générées depuis le logo de marque : on vérifie que le
      # script reste fonctionnel et que le résultat est bien celui commité.
      - name: Cohérence des icônes PWA
        run: |
          node scripts/generate-icons.mjs
          git diff --exit-code public/icons src/app/icon.png src/app/apple-icon.png
