name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # `npm run build` enchaîne déjà `tsc -b` puis `vite build`.
      - name: Types et build
        run: npm run build

      - name: Audit de sécurité (critique bloquant)
        run: npm audit --audit-level=critical

      # Non bloquant pour l'instant : ~67 erreurs de lint en attente.
      # À basculer en bloquant une fois l'arriéré résorbé.
      - name: Lint (informatif)
        continue-on-error: true
        run: npm run lint
